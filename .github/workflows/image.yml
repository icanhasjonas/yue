name: image

# Builds the RunPod worker image and pushes it to GHCR.
#   ghcr.io/<owner>/yue:latest   and   ghcr.io/<owner>/yue:<sha>
# `yue runpod setup` points the RunPod template at the <sha> tag, never at
# :latest, so a deploy is always a known build.

on:
  push:
    branches: [main]
    paths: [src/**, pyproject.toml, uv.lock, Dockerfile, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk (torch + CUDA wheels are ~6 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yue:latest
            ghcr.io/${{ github.repository_owner }}/yue:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
