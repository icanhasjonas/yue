name: image

# Builds the RunPod worker image and pushes it to GHCR.
#   ghcr.io/<owner>/yue:latest   and   ghcr.io/<owner>/yue:<sha>
# `yue runpod setup` points the RunPod template at the <sha> tag, never at
# :latest, so a deploy is always a known build.

on:
  push:
    branches: [main]
    paths: [src/**, pyproject.toml, uv.lock, Dockerfile, .github/workflows/image.yml]
  workflow_dispatch:

# One build at a time; a newer push supersedes the one in flight.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk (torch + CUDA wheels are ~6 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Layer cache comes from the last pushed image (inline cache metadata), not the
      # GHA cache: `type=gha,mode=max` uploaded the ~10 GB of dependency layers a
      # SECOND time after the registry push, into a cache capped at 10 GB, and held a
      # build in "exporting" for most of an hour. A code-only change now reuses the
      # dependency layers already in GHCR and uploads only src.
      # gzip level 1: layer compression was 12 of the build's minutes at the default.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/yue:latest
            ghcr.io/${{ github.repository_owner }}/yue:${{ github.sha }}
          outputs: type=registry,compression=gzip,compression-level=1
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/yue:latest
          cache-to: type=inline
