version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "yue2-infer" },
]

[package.optional-dependencies]
cuda = [
    { name = "nvidia-ml-py", marker = "sys_platform == 'linux'" },
    { name = "triton", marker = "sys_platform == 'linux'" },
    { name = "vllm", marker = "sys_platform == 'linux'" },
]
worker = [
    { name = "hf-transfer" },
    { name = "runpod" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "hf-transfer", marker = "extra == 'worker'", specifier = ">=0.1.8" },
    { name = "nvidia-ml-py", marker = "sys_platform == 'linux' and extra == 'cuda'", specifier = "==13.610.43" },
    { name = "runpod", marker = "extra == 'worker'", specifier = "==1.12.0" },
    { name = "triton", marker = "sys_platform == 'linux' and extra == 'cuda'", specifier = "==3.6.0" },
    { name = "vllm", marker = "sys_platform == 'linux' and extra == 'cuda'", specifier = "==0.19.0" },
    { name = "yue2-infer", git = "https://github.com/multimodal-art-projection/YuE?branch=main" },
]
provides-extras = ["cuda", "worker"]

[package.metadata.requires-dev]
dev = [{ name = "pytest", specifier = ">=8" }]

